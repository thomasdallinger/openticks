# Self-host the OpenTicks server.
#
#   With your own domain (automatic HTTPS):
#     DOMAIN=ticks.example.com docker compose --profile https up -d
#
#   Quick try without a domain (temporary https://*.trycloudflare.com URL, printed in the logs):
#     docker compose --profile tunnel up
#
#   Show the access key for the extension:
#     docker compose logs openticks

services:
  openticks:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      - openticks-data:/data
    environment:
      OPENTICKS_ACCESS_KEY: ${OPENTICKS_ACCESS_KEY:-}

  caddy:
    profiles: [https]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    command: caddy reverse-proxy --from ${DOMAIN:-set-DOMAIN-env-var.invalid} --to openticks:8787
    volumes:
      - caddy-data:/data

  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://openticks:8787
    depends_on: [openticks]

volumes:
  openticks-data:
  caddy-data:
